services:
  cli-proxy-api:
    # Pin the reviewed upstream release; override explicitly when upgrading.
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:v7.2.47}
    container_name: sep490_cli_proxy
    restart: unless-stopped
    profiles: ["oauth-gateway"]
    # Local POC only. Do not expose the management port publicly.
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:1455:1455"   # Codex OAuth callback
      - "127.0.0.1:54545:54545" # Claude OAuth callback
    volumes:
      - ./infra/cli-proxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./infra/cli-proxy/auths:/root/.cli-proxy-api
      - ./infra/cli-proxy/logs:/CLIProxyAPI/logs
    networks:
      - app_network

networks:
  app_network:
    external: false
