services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: sep490_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── GPU Service ─────────────────────────────────────────────────────────────
  # Không chạy ở dev compose (cần GPU). Bản self-hosted GPU nằm ở docker-compose.prod.yml.

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  # Local/dev storage backend for datasets. In production the same S3 API is
  # reached through the CDN domain (cdn-lab.fpt.edu.vn) via STORAGE_* env vars.
  minio:
    image: minio/minio:latest
    container_name: sep490_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dothang2504/sep490-be:latest
    container_name: sep490_backend
    restart: unless-stopped
    # Expose 3000 to host so the Vite dev server on Windows can proxy /api → localhost:3000.
    # In production the frontend nginx container reaches backend over the internal app_network
    # and this mapping is unnecessary; leave it here for local dev convenience.
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/sep_training
      - FRONTEND_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8080
      # Kết nối nội bộ tới gpu-service — không qua ngrok/IP ngoài
      - GPU_SERVICE_URL=http://gpu-service:5000
      - PORT=3000
      # ── Object storage (dev → internal MinIO). Production overrides these in .env
      #    to point at the CDN domain (see .env.example / LLMAware convention).
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_BUCKET=llm_trains
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_SECURE=false
    volumes:
      - uploads_data:/app/uploads
      - ./scripts:/app/scripts
      - ./gpu-service:/app/gpu-service
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Đã comment để backend không đợi gpu-service local khởi chạy
      # gpu-service:
      #   condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend_v2
      dockerfile: Dockerfile
    image: dothang2504/sep490-fe:latest
    container_name: sep490_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      # Port 443 chỉ dùng trên production server (có SSL cert)
      # - "443:443"
    networks:
      - app_network
    depends_on:
      - backend

  # ── Certbot (tự động gia hạn SSL) ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: sep490_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  minio_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_webroot:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge