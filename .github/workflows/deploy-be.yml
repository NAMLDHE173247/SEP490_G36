name: Deploy Backend to Azure App Service (Container)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'SEP490_WEBAPP-main/backend/**'

env:
  AZURE_WEBAPP_NAME: 'sep490-be' # Đổi thành tên App Service BE của bạn trên Azure
  DOCKER_IMAGE_NAME: 'dothang2504/sep490-be:latest' # Đổi thành tên image Docker Hub của bạn (ví dụ: username/repo:tag)

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./SEP490_WEBAPP-main/backend
          file: ./SEP490_WEBAPP-main/backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.DOCKER_IMAGE_NAME }}
