name: Deploy Frontend to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "SEP490_WEBAPP-main/frontend/**"
      - "SEP490_WEBAPP-main/frontend_v2/**"
      - ".github/workflows/deploy-fe.yml"

env:
  AZURE_WEBAPP_NAME: front-end
  NODE_VERSION: 22.x

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies and build with .env.production
        working-directory: SEP490_WEBAPP-main/frontend_v2
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FE }}
          package: SEP490_WEBAPP-main/frontend_v2/dist
